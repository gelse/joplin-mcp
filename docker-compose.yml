services:
  # ===========================================================================
  # Single combined service — Joplin CLI + Data API + MCP HTTP server
  # ===========================================================================
  # Builds from Dockerfile.combined — single image running the combined container.
  # The Data API binds to loopback inside the container; only the MCP port is
  # published to the host.
  # ===========================================================================
  joplin-mcp:
    build:
      context: .
      dockerfile: Dockerfile.combined
    image: joplin-api-combined
    container_name: joplin-mcp
    ports:
      # MCP_HOST_PORT selects the host-side port; the container always
      # listens on 3000 (any MCP_PORT value is canonicalized to 3000 by
      # entrypoint-combined.sh with a warning — use MCP_HOST_PORT instead).
      - '127.0.0.1:${MCP_HOST_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-300}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOPLIN_MASTER_PASSWORD=${JOPLIN_MASTER_PASSWORD:-}
      # Container always listens on 3000; host remapping is done via MCP_HOST_PORT.
    volumes:
      - joplin_data:/home/joplin/.config/joplin
    deploy:
      resources:
        # Starting points pending profiling — adjust per workload.
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.75'
          memory: 384M
    restart: unless-stopped
    init: true

  # ===========================================================================
  # Test runner (unchanged)
  # ===========================================================================
  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile.tests
    image: joplin-api-tests:latest
    volumes:
      - ./reports:/app/reports

volumes:
  joplin_data:
