# =============================================================================
# Migration note:
#   Existing joplin_data volumes mount unchanged (same uid 1001).  The single
#   container replaces the previous joplin-core + joplin-mcp pair.  The
#   two-container topology remains only in the integration-test stack
#   (docker-compose.test.yml).
# =============================================================================

services:
  # ===========================================================================
  # Single combined service — Joplin CLI + Data API + MCP HTTP server
  # ===========================================================================
  # Builds from Dockerfile.combined which merges the former joplin-core and
  # joplin-mcp containers.  The Data API binds to loopback inside the
  # container; only the MCP port is published to the host.
  # ===========================================================================
  joplin-mcp:
    build:
      context: .
      dockerfile: Dockerfile.combined
    image: joplin-api-combined
    container_name: joplin-mcp
    ports:
      - '127.0.0.1:${MCP_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-300}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCP_PORT=${MCP_PORT:-3000}
    volumes:
      - joplin_data:/home/joplin/.config/joplin
    deploy:
      resources:
        # Starting points pending profiling — sum of former core + mcp limits.
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.75'
          memory: 384M
    restart: unless-stopped
    init: true

  # ===========================================================================
  # Test runner (unchanged)
  # ===========================================================================
  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile.tests
    image: joplin-api-tests:latest
    volumes:
      - ./reports:/app/reports

volumes:
  joplin_data:
