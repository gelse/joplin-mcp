name: Integration Tests

on:
  pull_request:
    branches: [main, testing]
  workflow_dispatch:
    inputs:
      run_sync_lock_tests:
        description: 'Run SQLITE_BUSY destructive migration repro test (issue #27)'
        required: false
        default: false
        type: boolean

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Run integration tests
        run: bash scripts/run-integration-tests.sh

      - name: Check for JUnit report
        if: always()
        run: test -f reports/container/junit.xml && echo "JUnit report found" || echo "::warning::JUnit report missing at reports/container/junit.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: reports/container/junit.xml
          if-no-files-found: ignore

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration Test Results
          path: reports/container/junit.xml
          reporter: java-junit
          fail-on-error: false

  # Reproduces the SQLITE_BUSY destructive migration bug (GitHub issue #27).
  # Manually triggered only — slow and deliberately destructive to its
  # throwaway volume. Does NOT run on every PR.
  sqlite-busy-repro:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_sync_lock_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Run SQLITE_BUSY repro test
        run: bash scripts/run-integration-tests.sh
        env:
          RUN_SYNC_LOCK_TESTS: '1'

      - name: Collect container logs
        if: always()
        run: docker compose -f docker-compose.test.yml logs joplin-mcp > reports/container/joplin-mcp.log 2>&1 || true

      - name: Cleanup test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
